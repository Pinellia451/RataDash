name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset_name: ratadash-linux-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            asset_name: ratadash-darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_name: ratadash-darwin-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux musl tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Prepare release asset
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ratadash" "dist/${{ matrix.asset_name }}"
          chmod 755 "dist/${{ matrix.asset_name }}"
          file "dist/${{ matrix.asset_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: ratadash-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RataDash ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/ratadash-*
