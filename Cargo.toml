[package]
name = "ratadash"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.1"
description = "A lightweight Ratatui dashboard for Mihomo-compatible proxy cores"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
rpassword = "7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = "2.5"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"
